# Tự chạy toàn bộ unit test mỗi khi push hoặc mở pull request vào main.
# Dự án chỉ dùng standard library nên không cần cài dependency.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Cài Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Chạy unit test
        run: python -m unittest discover tests -v
